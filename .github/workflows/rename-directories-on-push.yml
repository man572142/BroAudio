name: Rename specific directories on push
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'Assets/BroAudio/Resources/**'
      - 'Assets/BroAudio/Samples/**'
      - 'Assets/BroAudio/Documentation/**'
      - 'Assets/BroAudio/Editor/Resources/**'
  workflow_dispatch:

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect, rename directories and push
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch origin "$BRANCH"

          # A push carries a range to narrow the work to directories it actually touched.
          # A manual run has none (and neither does a branch's first push, where BEFORE is
          # all zeros), so fall back to renaming whatever is still missing its ~.
          CHANGED=""
          FILTER_BY_PUSH=0
          if [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if CHANGED=$(git diff --name-only "$BEFORE" "$AFTER"); then
              FILTER_BY_PUSH=1
              echo "Push range: $BEFORE -> $AFTER on $BRANCH"
              echo "Changed files in push:"
              printf '%s\n' "$CHANGED"
            else
              echo "Could not diff $BEFORE..$AFTER; checking every directory instead."
            fi
          else
            echo "No usable push range ($EVENT on $BRANCH); checking every directory."
          fi

          # Base path for the target directories
          BASE="Assets/BroAudio"

          # Directory names under $BASE to check and rename (no base prefix here)
          OLD_DIRS=(Resources Samples Documentation Editor/Resources)

          RENAMED=0

          for OLD in "${OLD_DIRS[@]}"; do
            OLD_FULL="${BASE}/${OLD}"
            NEW="${OLD_FULL}~"

            # When the push range is known, only proceed if it touched the old directory
            if [ "$FILTER_BY_PUSH" -eq 1 ] \
               && ! printf '%s\n' "$CHANGED" | grep -qE "^${OLD_FULL}(/|$)"; then
              echo "No changes in ${OLD_FULL} for this push; skipping."
              continue
            fi

            # Confirm the directory exists at HEAD
            if git ls-tree -r HEAD --name-only | grep -qE "^${OLD_FULL}(/|$)"; then
              echo "Renaming ${OLD_FULL} -> ${NEW}"

              if git mv "${OLD_FULL}" "${NEW}" 2>/dev/null; then
                echo "git mv succeeded"
              else
                # Workaround for case-only or other mv failures: use tmp name in same parent dir
                PARENT_DIR="$(dirname "${OLD_FULL}")"
                BASE_NAME="$(basename "${OLD}")"
                TMP="${PARENT_DIR}/${BASE_NAME}_tmp_rename_$(date +%s)"
                echo "git mv failed; using temporary name ${TMP}"
                git mv "${OLD_FULL}" "${TMP}"
                git mv "${TMP}" "${NEW}"
              fi

              RENAMED=1
            else
              echo "${OLD_FULL} not present at HEAD; nothing to rename."
            fi
          done

          if [ "$RENAMED" -eq 1 ]; then
            git add -A
            git commit -m "Append ~ to asset directories under ${BASE}" || {
              echo "Nothing to commit after rename; exiting."
              exit 0
            }

            # Push back to the same branch
            git push origin "HEAD:${BRANCH}"
            echo "Pushed rename commit to ${BRANCH}."
          else
            echo "No directories were renamed."
          fi
