# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [main, test, DEV_Unity6]
  pull_request:
    branches: [main, test, DEV_Unity6]
  workflow_dispatch:

# A PR run is superseded the moment its branch is pushed again, so cancel the stale one
# rather than paying for two Unity runs. Push runs on main/test are not grouped together
# (github.ref differs per branch) and are never cancelled: each one is the only run that
# ever sees the tree that actually landed, including the commit
# rename-directories-on-push.yml pushes on top of a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/cache/restore@v4
        id: library-cache
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.testMode }}-

      # Addressables keeps its play mode catalog inside Library, so the restore above brings back whatever state
      # the previous run left there - and a restored Library never rebuilds it. Every run that restored one
      # (7, 8, 12) lost the whole AddressablesTests suite to
      #   Invalid path in TextDataProvider : 'Library/com.unity.addressables/aa/Linux/settings.json'
      #   -> Addressables - Unable to load runtime data -> No Location found for Key=<fixture guid>
      # while every cold run passed. Dropping this subtree is not the fix - run 12 dropped it and failed anyway,
      # so what the restored Library suppresses is not the file. The suite now builds the catalog itself, before
      # play mode, in Assets/Tests/Editor/AddressablesPlayModeContent.cs.
      # The drop stays because it makes that build load-bearing: without it a stale cached catalog could carry a
      # run whose prebuild had actually failed, which is the false green this workflow just spent three runs on.
      - name: Drop the cached Addressables play mode catalog
        run: rm -rf Library/com.unity.addressables

      # The stock unityci/editor image ships no audio libraries, so FMOD finds no output device
      # and falls back to a non-realtime null sink pumped by the frame loop - measured at 747.94x
      # wall time, which makes every PlayMode timing test a coin flip. This image adds a
      # timer-paced PulseAudio null sink; see .github/docker/Dockerfile. The suite's
      # RequireRealtimeAudioClock reports the measured rate, so the results say whether it worked.
      #
      # It has to come from a registry rather than a local tag: unity-test-runner runs an
      # unconditional `docker pull` on customImage before it runs the container.
      - name: Resolve the editor images
        id: images
        if: matrix.testMode == 'PlayMode'
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '[:cntrl:]')
          # -linux-il2cpp-3 mirrors the tag unity-test-runner resolves for this project; the
          # trailing -3 is game-ci's image revision and moves independently of the Unity version.
          echo "base=unityci/editor:ubuntu-${version}-linux-il2cpp-3" >> "$GITHUB_OUTPUT"
          echo "audio=ghcr.io/${{ github.repository_owner }}/unity-editor-audio:${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: matrix.testMode == 'PlayMode'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once per Unity version, then reused - the push is only paid on an editor upgrade.
      - name: Build the editor image with an audio device
        if: matrix.testMode == 'PlayMode'
        run: |
          image='${{ steps.images.outputs.audio }}'
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already published, reusing it."
          else
            docker build --build-arg BASE_IMAGE='${{ steps.images.outputs.base }}' --tag "$image" .github/docker
            docker push "$image"
          fi

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ${{ steps.images.outputs.audio }} # empty on EditMode, which needs no audio device
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # A suite that compiled to nothing does not fail - it is absent from the results, and the leg reports every
      # test it did run as green. Run 11 passed that way twice over: PlayMode ran 124 tests instead of 132 with
      # AddressablesTests gone, EditMode 209 instead of 214 with LocalizationClipStrategyTests gone, and the
      # Addressables failure they were hiding came straight back on the next push.
      - name: Check every required test suite ran
        if: always()
        run: >-
          python3 .github/scripts/check_test_suites.py
          '${{ matrix.testMode }}'
          '${{ matrix.testMode }}-results'
          .github/required-test-suites.json

      # Saved separately from the restore so a failing test run still warms the
      # Library for the next one - actions/cache skips its own save on failure.
      - uses: actions/cache/save@v4
        if: always() && steps.library-cache.outputs.cache-hit != 'true'
        with:
          path: Library
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.testMode }}-results
          path: ${{ matrix.testMode }}-results
